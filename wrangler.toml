name = "woocommerce-mcp-server"
main = "woocommerce_mcp/worker.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

# Default non-sensitive environment variables
[vars]
WOOCOMMERCE_STORE_URL = "https://dev-anythingstore37.pantheonsite.io"

# OAuth 2.0 / 2.1 Authorization Server (Auth0 with RFC 7591 Dynamic Client Registration)
OAUTH_AUTH_SERVER_URL = "https://woocommerce-mcp-server.us.auth0.com"
OAUTH_JWKS_URL = "https://woocommerce-mcp-server.us.auth0.com/.well-known/jwks.json"
OAUTH_ISSUER = "https://woocommerce-mcp-server.us.auth0.com/"
OAUTH_AUDIENCE = "https://woocommerce-mcp-server.workers.dev"
OAUTH_JWKS_CACHE_TTL_SECONDS = "300"

# Dual-Layer Rate Limiting Policy
# 1. Authenticated client limit (keyed by token subject)
MCP_RATE_LIMIT_MAX_REQUESTS = "50"
MCP_RATE_LIMIT_WINDOW_SECONDS = "10"
# 2. Unauthenticated client limit (keyed by IP for discovery & handshakes)
UNAUTH_RATE_LIMIT_MAX_REQUESTS = "20"
UNAUTH_RATE_LIMIT_WINDOW_SECONDS = "60"

# WooCommerce API Request Resilience
WOOCOMMERCE_MAX_RETRIES = "3"
WOOCOMMERCE_TIMEOUT_SECONDS = "15"

# Sensitive secrets (configure via Cloudflare Dashboard or `npx wrangler secret put`):
# - WOOCOMMERCE_CONSUMER_KEY
# - WOOCOMMERCE_CONSUMER_SECRET
