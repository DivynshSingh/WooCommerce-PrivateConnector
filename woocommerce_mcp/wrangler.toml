name = "woocommerce-mcp-server"
main = "worker.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

# Default non-sensitive environment variables
[vars]
WOOCOMMERCE_STORE_URL = "https://dev-anythingstore37.pantheonsite.io"

# OAuth 2.1 Resource Server Configuration (Supabase Auth)
OAUTH_AUTH_SERVER_URL = "https://esommvnvcatygpciqdps.supabase.co/auth/v1"
OAUTH_JWKS_URL = "https://esommvnvcatygpciqdps.supabase.co/auth/v1/.well-known/jwks.json"
OAUTH_ISSUER = "https://esommvnvcatygpciqdps.supabase.co/auth/v1"
OAUTH_JWKS_CACHE_TTL_SECONDS = "300"
# Optional overrides:
# OAUTH_RESOURCE_SERVER_URL = "https://woocommerce-mcp-server.workers.dev"

# Rate Limiting & Performance Configuration
MCP_RATE_LIMIT_MAX_REQUESTS = "50"
MCP_RATE_LIMIT_WINDOW_SECONDS = "10"
WOOCOMMERCE_MAX_RETRIES = "3"
WOOCOMMERCE_TIMEOUT_SECONDS = "15"

# Sensitive secrets (configure via Cloudflare Dashboard or `npx wrangler secret put`):
# - WOOCOMMERCE_CONSUMER_KEY
# - WOOCOMMERCE_CONSUMER_SECRET
