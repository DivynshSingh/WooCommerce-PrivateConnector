name = "woocommerce-mcp-server-v2"
main = "worker.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

# Default non-sensitive environment variables
[vars]
WOOCOMMERCE_STORE_URL = "https://your-store.example.com"

# OAuth 2.0 / 2.1 Authorization Server (Auth0 with RFC 7591 Dynamic Client Registration)
OAUTH_AUTH_SERVER_URL = "https://your-tenant.us.auth0.com"
# Optional overrides:
OAUTH_AUDIENCE = "https://your-worker-subdomain.workers.dev"
OAUTH_JWKS_CACHE_TTL_SECONDS = "300"

# Optional Static Client ID (if you pre-register a native/web application in Auth0 or prefer bypassing DCR limits)
# OAUTH_CLIENT_ID = "your_auth0_client_id"

# Dual-Layer Rate Limiting Policy
MCP_RATE_LIMIT_MAX_REQUESTS = "50"
MCP_RATE_LIMIT_WINDOW_SECONDS = "10"
UNAUTH_RATE_LIMIT_MAX_REQUESTS = "20"
UNAUTH_RATE_LIMIT_WINDOW_SECONDS = "60"

# WooCommerce API Request Resilience
WOOCOMMERCE_MAX_RETRIES = "3"
WOOCOMMERCE_TIMEOUT_SECONDS = "15"

# Sensitive secrets (configure via `npx wrangler secret put`):
# - WOOCOMMERCE_CONSUMER_KEY
# - WOOCOMMERCE_CONSUMER_SECRET
